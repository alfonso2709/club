<!DOCTYPE html>
<html>
<head>
    <title>Freehold Boro Boys Soccer</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <p>FREEHOLD BORO BOYS SOCCER</p>
    <img src="images/nike.png">
</header>

<nav>
    <img src="images/logo.png">

    <a href="#matches">MATCHES</a>
    <a href="#record">RECORD</a>
    <a href="#players">PLAYERS</a>
    <a href="#media">MEDIA</a>

    <span>LOGIN ●</span>
</nav>

<section class="home">

    <div class="slideshow">
        <img id="homeImage" src="images/home1.jpg">
        <div class="timer"></div>
    </div>
    <div id="matches">

        <div class="title">
            <h2>MATCHES</h2>
            <img src="images/logo.png">
        </div>

        <div class="next">
            <h3>NEXT MATCH</h3>
            <b id="countdown">00 : 00 : 00 : 00</b>
            <small>DAYS &nbsp;&nbsp; HRS &nbsp;&nbsp; MIN &nbsp;&nbsp; SEC</small>
        </div>

        <div class="match-boxes">

            <button id="matchLeft">&lt;</button>

            <div>
                <img id="match1" src="images/match1.jpg">
            </div>

            <div class="middle">
                <img id="match2" src="images/match2.jpg">
            </div>

            <div>
                <img id="match3" src="images/match3.jpg">
            </div>

            <button id="matchRight">&gt;</button>

        </div>

    </div>

</section>
<section id="record">

    <div class="title">
        <h2>RECORD THIS SEASON</h2>
        <img src="images/logo.png">
    </div>

    <div class="record-boxes">

        <div>RECORD</div>
        <div>TEAM STATS</div>

    </div>

</section>
<section id="players">

    <div class="title">

        <h2>FREEHOLD BORO PLAYERS</h2>

        <div>
            <button id="playerLeft">&lt;</button>
            <button id="playerRight">&gt;</button>
        </div>

    </div>

    <div class="players">

        <div class="player">
            <img id="player1" src="images/player1.jpg">
            <div class="playerInfo">
                <p id="playerName1">PLAYER 1</p>
                <p id="playerStats1">PLAYER STATS</p>
            </div>
        </div>

        <div class="player">
            <img id="player2" src="images/player2.jpg">
            <div class="playerInfo">
                <p id="playerName2">PLAYER 2</p>
                <p id="playerStats2">PLAYER STATS</p>
            </div>
        </div>

        <div class="player">
            <img id="player3" src="images/player3.jpg">
            <div class="playerInfo">
                <p id="playerName3">PLAYER 3</p>
                <p id="playerStats3">PLAYER STATS</p>
            </div>
        </div>

    </div>

</section>
<section id="media">

    <div class="title">

        <div>
            <h2>MEDIA</h2>
            <img src="images/logo.png">
        </div>

        <div>
            <button id="mediaLeft">&lt;</button>
            <button id="mediaRight">&gt;</button>
        </div>

    </div>


    <div class="media">

        <div>
            <img id="media1" src="image copy 2.png">
        </div>

        <div>
            <img id="media2" src="image copy 2.png">
        </div>

    </div>

    <footer></footer>

</section>


<script src="java.js"></script>

</body>
</html>
